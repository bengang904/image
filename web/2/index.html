<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProPixel Studio Ultra 6.3 - Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-950: #050506; --bg-900: #09090b; --bg-800: #121214;
            --accent: #3b82f6; --accent-hi: #60a5fa; --border: #27272a;
            --text: #f4f4f5; --text-dim: #71717a; --panel-w: 260px; --tool-w: 44px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { height: 100%; background: var(--bg-950); color: var(--text); overflow: hidden; touch-action: none; }
        header { height: 44px; background: var(--bg-900); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; z-index: 2001; position: relative; gap: 8px; }
        .brand { font-weight: 900; color: var(--accent); font-size: 14px; letter-spacing: -0.5px; margin-right: 10px; }
        .nav-item { padding: 0 12px; font-size: 13px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; height: 100%; position: relative; }
        .nav-item:hover { color: var(--text); background: var(--bg-800); }
        .dropdown { position: absolute; top: 44px; left: 0; background: var(--bg-900); border: 1px solid var(--border); min-width: 160px; display: none; z-index: 5000; }
        .nav-item:hover .dropdown { display: block; }
        .drop-item { padding: 10px 15px; font-size: 12px; border-bottom: 1px solid var(--border); }
        .drop-item:hover { background: var(--accent); color: white; }
        main { display: flex; height: calc(100% - 74px); position: relative; overflow: hidden; }
        .toolbar { width: var(--tool-w); background: var(--bg-900); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s; flex-shrink: 0; }
        .toolbar.collapsed { margin-left: calc(var(--tool-w) * -1); transform: translateX(-100%); }
        .workspace { flex: 1; background: #0c0c0e; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .cv-wrap { box-shadow: 0 0 40px rgba(0,0,0,0.6); position: relative;}
        .sidebar { width: var(--panel-w); background: var(--bg-900); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1500; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-right 0.3s; flex-shrink: 0; }
        .sidebar.collapsed { margin-right: calc(var(--panel-w) * -1); transform: translateX(100%); }
        .t-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; background: transparent; border: 1px solid transparent; flex-shrink: 0; }
        .t-btn.active { color: var(--accent); background: rgba(59, 130, 246, 0.1); border-color: var(--accent); }
        .t-sep { width: 16px; height: 1px; background: var(--border); margin: 4px 0; }
        .panel { border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
        .p-hd { background: #161618; padding: 8px 12px; font-size: 10px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .p-bd { padding: 12px; }
        .s-group { margin-bottom: 10px; }
        .s-info { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
        input[type=range] { width: 100%; height: 4px; background: var(--border); appearance: none; outline: none; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--accent); cursor: pointer; }
        .cp-small { width: 100%; aspect-ratio: 1.8; background: red; position: relative; margin-bottom: 8px; border: 1px solid var(--border); }
        .cp-w { position: absolute; inset: 0; background: linear-gradient(to right, #fff, transparent); }
        .cp-b { position: absolute; inset: 0; background: linear-gradient(to top, #000, transparent); }
        .cp-cur { position: absolute; width: 8px; height: 8px; border: 1px solid #fff; transform: translate(-50%, -50%); pointer-events: none; }
        .hue-bar { width: 100%; height: 8px; background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); margin-bottom: 8px; position: relative; }
        .hue-cur { position: absolute; top:0; width: 2px; height: 100%; background: #fff; transform: translateX(-50%); pointer-events: none; }
        footer { height: 30px; background: var(--bg-900); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; font-size: 10px; color: var(--text-dim); justify-content: space-between; }
        
        @media (max-width: 480px) {
            header { padding: 0 4px; gap: 2px; }
            .brand { display: none; }
            .nav-item { padding: 0 4px; font-size: 11px; }
            .toolbar, .sidebar { position: absolute; height: 100%; }
            .toolbar { left: 0; }
            .sidebar { right: 0; width: 200px; }
            .panel-left, .panel-right { width: 28px; height: 28px; }
            .toolbar.collapsed { margin-left: 0; }
            .sidebar.collapsed { margin-right: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="t-btn panel-left" onclick="toggleSide('toolbar')"><i data-lucide="panel-left"></i></div>
    <div class="brand">未完工</div>
    <div class="nav-item">文件
        <div class="dropdown">
            <div class="drop-item" onclick="newP()">新建</div>
            <div class="drop-item" onclick="document.getElementById('img-u').click()">导入</div>
            <div class="drop-item" onclick="exp()">导出 PNG</div>
        </div>
    </div>
    <div style="flex:1"></div>
    <div class="t-btn panel-right" onclick="toggleSide('sidebar')"><i data-lucide="panel-right"></i></div>
</header>

<main>
    <nav class="toolbar" id="toolbar">
        <button class="t-btn active" data-t="select"><i data-lucide="mouse-pointer-2"></i></button>
        <button class="t-btn" data-t="zoomIn"><i data-lucide="zoom-in"></i></button>
        <button class="t-btn" data-t="zoomOut"><i data-lucide="zoom-out"></i></button>
        <div class="t-sep"></div>
        <button class="t-btn" data-t="brush"><i data-lucide="pencil"></i></button>
        <button class="t-btn" data-t="eraser"><i data-lucide="eraser"></i></button>
        <button class="t-btn" data-t="fill"><i data-lucide="pipette"></i></button>
        <div class="t-sep"></div>
        <button class="t-btn" data-t="line"><i data-lucide="minus"></i></button>
        <button class="t-btn" data-t="rect"><i data-lucide="square"></i></button>
        <button class="t-btn" data-t="circle"><i data-lucide="circle"></i></button>
        <button class="t-btn" data-t="text"><i data-lucide="type"></i></button>
        <div class="t-sep"></div>
        <button class="t-btn" onclick="canvas.remove(canvas.getActiveObject())"><i data-lucide="trash-2"></i></button>
    </nav>
    <section class="workspace">
        <div class="cv-wrap"><canvas id="main"></canvas></div>
    </section>
    <aside class="sidebar" id="sidebar">
        <div class="panel">
            <div class="p-hd">属性设置</div>
            <div class="p-bd">
                <div class="s-group">
                    <div class="s-info"><span>尺寸 / 描边</span><span id="v-s">5</span></div>
                    <input type="range" id="s-s" min="1" max="100" value="5">
                </div>
                <div class="cp-small" id="cp">
                    <div class="cp-w"></div><div class="cp-b"></div>
                    <div class="cp-cur" id="cp-c"></div>
                </div>
                <div class="hue-bar" id="hb"><div class="hue-cur" id="hb-c"></div></div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div id="c-p" style="width:30px; height:30px; background:#3b82f6; border:1px solid var(--border)"></div>
                    <div id="h-s" style="font-family:monospace; font-size:12px;">#3B82F6</div>
                </div>
            </div>
        </div>
    </aside>
</main>

<footer><div id="st">Status: Ready</div><div id="zi">100%</div></footer>

<input type="file" id="img-u" hidden accept="image/*">

<script>
    const canvas = new fabric.Canvas('main', { width: 800, height: 600, backgroundColor: '#ffffff', preserveObjectStacking: true });
    let tool = 'select', color = '#3b82f6', size = 5, hsv = { h: 217, s: 75, v: 96 };
    const ZOOM_FACTOR = 1.2;

    function init() {
        lucide.createIcons();
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
        bind();
        bindC();
        adapt();
        window.onresize = adapt;
    }

    function toggleSide(id) {
        document.getElementById(id).classList.toggle('collapsed');
        setTimeout(adapt, 310);
    }

    function bind() {
        document.querySelectorAll('.t-btn[data-t]').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.t-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                tool = b.dataset.t;
                updateT();
            };
        });
        document.getElementById('s-s').oninput = (e) => {
            size = parseInt(e.target.value);
            document.getElementById('v-s').innerText = size;
            const a = canvas.getActiveObject();
            if (a) {
                if (a.isType('path') || a.isType('line')) a.set('strokeWidth', size);
                else if (a.isType('rect') || a.isType('circle')) a.set('strokeWidth', size);
                canvas.renderAll();
            }
            updateB();
        };
        document.getElementById('img-u').onchange = (e) => {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = (x) => fabric.Image.fromURL(x.target.result, (i) => {
                i.scaleToWidth(300); i.set({ left: 100, top: 100 });
                canvas.add(i).setActiveObject(i);
            });
            r.readAsDataURL(f);
        };
        const cp = document.getElementById('cp'), hb = document.getElementById('hb');
        const move = (el, fn) => {
            const up = () => { window.onmousemove = null; window.ontouchmove = null; };
            const m = (e) => {
                e.preventDefault();
                const r = el.getBoundingClientRect();
                const p = e.touches ? e.touches[0] : e;
                fn(Math.max(0, Math.min(1, (p.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (p.clientY - r.top) / r.height)));
                updateP();
            };
            el.onmousedown = () => { window.onmousemove = m; window.onmouseup = up; };
            el.ontouchstart = (e) => { window.ontouchmove = m; window.ontouchend = up; m(e); };
        };
        move(cp, (x, y) => { hsv.s = x * 100; hsv.v = (1 - y) * 100; updateP(); });
        move(hb, (x) => { hsv.h = x * 360; updateP(); });
        updateP();
    }

    function updateP() {
        color = hsvToHex(hsv.h, hsv.s, hsv.v);
        document.getElementById('c-p').style.backgroundColor = color;
        document.getElementById('h-s').innerText = color.toUpperCase();
        document.getElementById('cp').style.backgroundColor = hsvToHex(hsv.h, 100, 100);
        document.getElementById('hb-c').style.left = (hsv.h / 360 * 100) + '%';
        document.getElementById('cp-c').style.left = hsv.s + '%';
        document.getElementById('cp-c').style.top = (100 - hsv.v) + '%';
        const a = canvas.getActiveObject();
        if (a && !a.isType('image')) {
            if (a.isType('path') || a.isType('line')) a.set('stroke', color);
            else { a.set('fill', color); a.set('stroke', color); }
            canvas.renderAll();
        }
        updateB();
    }

    function updateT() {
        canvas.isDrawingMode = (tool === 'brush' || tool === 'eraser');
        canvas.selection = (tool === 'select');
        canvas.defaultCursor = (tool === 'fill' || tool === 'zoomIn' || tool === 'zoomOut') ? 'crosshair' : 'default';
        canvas.getObjects().forEach(o => { o.selectable = o.evented = (tool === 'select'); });
        if (canvas.isDrawingMode) updateB();
        canvas.renderAll();
    }

    function updateB() {
        if (!canvas.isDrawingMode) return;
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.width = size;
        canvas.freeDrawingBrush.color = tool === 'eraser' ? '#ffffff' : color;
    }

    function handleZoom(p) {
        let newZoom = canvas.getZoom();
        if (tool === 'zoomIn') newZoom *= ZOOM_FACTOR;
        else if (tool === 'zoomOut') newZoom /= ZOOM_FACTOR;
        newZoom = Math.max(0.1, Math.min(newZoom, 20));
        
        const vpt = canvas.viewportTransform;
        const zoomPoint = new fabric.Point(p.x * vpt[0] + vpt[4], p.y * vpt[3] + vpt[5]);
        
        canvas.zoomToPoint(zoomPoint, newZoom);
        document.getElementById('zi').innerText = Math.round(newZoom * 100) + '%';
    }

    function bindC() {
        let isD, stP, tO;
        canvas.on('mouse:down', (o) => {
            const p = canvas.getPointer(o.e);
            if (tool === 'zoomIn' || tool === 'zoomOut') {
                handleZoom(p);
                return;
            }
            if (tool === 'fill') { pickColor(p); return; }
            if (canvas.isDrawingMode || tool === 'select') return;
            isD = true; stP = p;
            const opt = { left: stP.x, top: stP.y, fill: color, stroke: color, strokeWidth: size, selectable: true, evented: true };
            if (tool === 'line') tO = new fabric.Line([stP.x, stP.y, stP.x, stP.y], opt);
            else if (tool === 'rect') tO = new fabric.Rect({...opt, width: 0, height: 0});
            else if (tool === 'circle') tO = new fabric.Circle({...opt, radius: 0, originX: 'center', originY: 'center'});
            else if (tool === 'text') {
                tO = new fabric.IText('Input', { left: stP.x, top: stP.y, fill: color, selectable: true });
                canvas.add(tO).setActiveObject(tO); isD = false;
            }
            if (tO && tool !== 'text') canvas.add(tO);
        });
        canvas.on('mouse:move', (o) => {
            if (!isD) return; const p = canvas.getPointer(o.e);
            if (tool === 'line') tO.set({ x2: p.x, y2: p.y });
            else if (tool === 'rect') tO.set({ width: Math.abs(p.x - stP.x), height: Math.abs(p.y - stP.y), left: Math.min(p.x, stP.x), top: Math.min(p.y, stP.y) });
            else if (tool === 'circle') tO.set({ radius: Math.sqrt(Math.pow(p.x - stP.x, 2) + Math.pow(p.y - stP.y, 2)) });
            canvas.renderAll();
        });
        canvas.on('mouse:up', () => { if (isD) { isD = false; tO.setCoords(); canvas.setActiveObject(tO); tO = null; } });
    }

    function pickColor(p) {
        const ctx = canvas.getContext('2d');
        const vpt = canvas.viewportTransform;
        const retina = canvas.getRetinaScaling();
        const x = (p.x * vpt[0] + vpt[4]) * retina;
        const y = (p.y * vpt[3] + vpt[5]) * retina;
        const data = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
        hsv = rgbToHsv(data[0], data[1], data[2]);
        updateP();
    }

    function rgbToHsv(r, g, b) {
        r /= 255, g /= 255, b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, v = max;
        const d = max - min;
        s = max === 0 ? 0 : d / max;
        if (max === min) { h = 0; }
        else {
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, v: v * 100 };
    }

    function hsvToHex(h, s, v) {
        s /= 100; v /= 100;
        let c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; g = b = c; } else { r = c; b = x; }
        const f = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
        return `#${f(r)}${f(g)}${f(b)}`;
    }

    function adapt() {
        const ww = window.innerWidth;
        const wh = window.innerHeight;
        const tb = document.getElementById('toolbar');
        const sb = document.getElementById('sidebar');
        let offset = 0;
        if (ww > 768) {
            if (!tb.classList.contains('collapsed')) offset += 44;
            if (!sb.classList.contains('collapsed')) offset += 260;
        }
        canvas.setDimensions({ width: Math.max(300, ww - offset - 20), height: wh - 100 });
        canvas.renderAll();
    }

    function newP() { if (confirm('确认清空吗？')) { canvas.clear(); canvas.backgroundColor = '#ffffff'; canvas.setZoom(1); document.getElementById('zi').innerText = '100%'; canvas.renderAll(); } }
    function exp() { const l = document.createElement('a'); l.download = 'pixel.png'; l.href = canvas.toDataURL(); l.click(); }
    init();
</script>
</body>
</html>
