<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人脸私钥生成</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --neon: #00f2fe; --bg: #000; --panel: #0a0a0a; --border: #222; --text: #fff; --warn: #ff4444; --safe: #00ff41; }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100svh; overflow: hidden;
        }

        .app-container { 
            width: 100%; max-width: 450px; 
            display: flex; flex-direction: column; gap: 10px; padding: 15px;
            height: 100svh;
        }

        .view-port { 
            position: relative; width: 100%; aspect-ratio: 4 / 3; 
            border: 1px solid var(--border); background: #050505; 
            overflow: hidden; flex-shrink: 0;
        }

        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .processing-mask { position: absolute; inset: 0; background: rgba(0, 242, 254, 0.15); display: none; z-index: 2; pointer-events: none; }
        canvas#raw-canvas { position: absolute; z-index: 3; width: 100%; height: 100%; }
        
        .guide-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 55%; height: 75%; border: 2px dashed rgba(255, 255, 255, 0.2); 
            z-index: 1; pointer-events: none; border-radius: 50% !important;
        }

        .status-box { text-align: center; padding: 12px; font-weight: 800; font-size: 13px; border: 1px solid var(--border); color: #555; letter-spacing: 2px; flex-shrink: 0; }
        .status-box.active { border-color: var(--neon); color: var(--neon); }
        .status-box.locked { border-color: var(--safe); color: var(--safe); background: rgba(0,255,65,0.05); }

        .panel { 
            background: var(--panel); border: 1px solid var(--border); padding: 12px; 
            flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto;
        }

        .ortho-preview { width: 100%; height: 80px; background: #000; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        canvas#ortho-canvas { width: 100%; height: 100%; }
        
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-family: monospace; font-size: 10px; color: #666; }
        
        #result-area { display: none; margin-top: 10px; flex-direction: column; gap: 8px; }
        #key-box { 
            background: #000; border: 1px dotted var(--safe); padding: 10px; 
            font-family: monospace; font-size: 11px; color: var(--safe); 
            word-break: break-all; line-height: 1.4;
        }
        
        .action-btn { 
            width: 100%; background: none; border: 1px solid #333; color: #aaa; 
            padding: 12px; font-size: 11px; cursor: pointer; text-transform: uppercase;
        }
        .copy-btn { border-color: var(--safe); color: var(--safe); }

        .scan-line { position: absolute; width: 100%; height: 2px; background: var(--neon); top: 0; left: 0; z-index: 4; display: none; box-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body>

    <div class="app-container">
        <h2 style="font-size: 11px; letter-spacing: 3px; text-align: center; color: #444; flex-shrink: 0;">BIOMETRIC KEY NODE</h2>

        <div class="view-port">
            <video id="video" autoplay muted playsinline></video>
            <div class="guide-box" id="guide-box"></div>
            <div id="processing-mask" class="processing-mask"></div>
            <canvas id="raw-canvas"></canvas>
            <div id="scan-line" class="scan-line"></div>
        </div>

        <div id="status-display" class="status-box">系统初始化...</div>

        <div class="panel">
            <div class="ortho-preview">
                <canvas id="ortho-canvas" width="200" height="80"></canvas>
            </div>
            <div class="metrics">
                <div>水平偏航: <b id="yaw-val">--</b></div>
                <div>翻滚角度: <b id="tilt-val">--</b></div>
                <div>缩放比例: <b id="scale-val">--</b></div>
                <div>采样进度: <b id="progress-val">0%</b></div>
            </div>
            
            <div id="result-area">
                <div id="key-box"></div>
                <button class="action-btn copy-btn" id="copy-btn">复制私钥</button>
                <button class="action-btn" onclick="location.reload()">重新验证</button>
            </div>
        </div>
    </div>

<script>
    const video = document.getElementById('video');
    const rawCanvas = document.getElementById('raw-canvas');
    const orthoCanvas = document.getElementById('ortho-canvas');
    const statusDisplay = document.getElementById('status-display');
    const scanLine = document.getElementById('scan-line');
    const mask = document.getElementById('processing-mask');
    const guideBox = document.getElementById('guide-box');
    const keyBox = document.getElementById('key-box');
    const resultArea = document.getElementById('result-area');
    const copyBtn = document.getElementById('copy-btn');
    
    const rawCtx = rawCanvas.getContext('2d');
    const orthoCtx = orthoCanvas.getContext('2d');

    let isLocked = false, isProcessing = false, samples = [];
    const MAX_SAMPLES = 10; 

    async function init() {
        try {
            const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "user", 
                    width: { ideal: 640, max: 640 }, 
                    height: { ideal: 480, max: 480 } 
                } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                rawCanvas.width = video.videoWidth;
                rawCanvas.height = video.videoHeight;
                loop();
            };
        } catch (e) {
            statusDisplay.innerText = "硬件连接错误";
        }
    }

    function loop() {
        if (!isLocked) render();
        requestAnimationFrame(loop);
    }

    async function render() {
        const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
        rawCtx.clearRect(0, 0, rawCanvas.width, rawCanvas.height);
        orthoCtx.clearRect(0, 0, orthoCanvas.width, orthoCanvas.height);

        if (det) {
            const pts = det.landmarks.positions;
            const nose = pts[30], leftEye = pts[36], rightEye = pts[45];
            const yaw = Math.abs(nose.x - leftEye.x) / Math.abs(nose.x - rightEye.x);
            const isForward = yaw > 0.88 && yaw < 1.14; 
            const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
            const scale = 100 / Math.sqrt(Math.pow(rightEye.x-leftEye.x, 2) + Math.pow(rightEye.y-leftEye.y, 2));

            document.getElementById('yaw-val').innerText = isForward ? "已锁定" : "偏离";
            document.getElementById('tilt-val').innerText = (angle * 180 / Math.PI).toFixed(1) + "°";
            document.getElementById('scale-val').innerText = scale.toFixed(2);

            drawOrtho(pts, nose, angle, scale, isForward);

            if (isForward) {
                guideBox.style.borderColor = "var(--safe)";
                if (!isProcessing) {
                    isProcessing = true;
                    mask.style.display = 'block';
                    scanLine.style.display = 'block';
                    runScanLine();
                }
                autoCapture(det.landmarks);
            } else {
                guideBox.style.borderColor = "var(--warn)";
                if (isProcessing) resetState();
                statusDisplay.innerText = "请将面部居中";
                statusDisplay.className = "status-box active";
            }
        } else {
            guideBox.style.borderColor = "rgba(255,255,255,0.2)";
            if (isProcessing) resetState();
            statusDisplay.innerText = "正在扫描...";
            statusDisplay.className = "status-box";
        }
    }

    function runScanLine() {
        let pos = 0;
        const anim = setInterval(() => {
            if (!isProcessing || isLocked) { clearInterval(anim); scanLine.style.display = 'none'; return; }
            pos = (pos + 4) % 100;
            scanLine.style.top = pos + "%";
        }, 30);
    }

    function drawOrtho(pts, nose, angle, scale, isForward) {
        const cosA = Math.cos(-angle), sinA = Math.sin(-angle);
        const corePoints = [27, 28, 29, 30, 33, 36, 39, 42, 45, 48, 54];
        orthoCtx.save();
        orthoCtx.translate(orthoCanvas.width/2, orthoCanvas.height/2);
        orthoCtx.strokeStyle = isForward ? 'var(--neon)' : '#333';
        orthoCtx.strokeRect(-25, -30, 50, 60);
        corePoints.forEach(idx => {
            const p = pts[idx];
            const rx = (p.x - nose.x) * cosA - (p.y - nose.y) * sinA;
            const ry = (p.x - nose.x) * sinA + (p.y - nose.y) * cosA;
            orthoCtx.fillStyle = isForward ? 'var(--neon)' : '#333';
            orthoCtx.beginPath();
            orthoCtx.arc(rx * scale * 0.5, ry * scale * 0.5, 1.2, 0, Math.PI*2);
            orthoCtx.fill();
        });
        orthoCtx.restore();
    }

    async function autoCapture(landmarks) {
        statusDisplay.innerText = "正在锁定特征...";
        statusDisplay.className = "status-box active";
        
        const pts = landmarks.positions;
        const nose = pts[30], leftEye = pts[36], rightEye = pts[45];
        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        const scale = 100 / Math.sqrt(Math.pow(rightEye.x-leftEye.x, 2) + Math.pow(rightEye.y-leftEye.y, 2));
        const cosA = Math.cos(-angle), sinA = Math.sin(-angle);
        const corePoints = [27, 28, 29, 30, 33, 36, 39, 42, 45, 48, 54];
        
        const feature = corePoints.map(idx => {
            const p = pts[idx];
            const rx = (p.x - nose.x) * cosA - (p.y - nose.y) * sinA;
            const ry = (p.x - nose.x) * sinA + (p.y - nose.y) * cosA;
            return `${Math.round((rx * scale) / 45)},${Math.round((ry * scale) / 45)}`;
        }).join('|');

        samples.push(feature);
        document.getElementById('progress-val').innerText = Math.round((samples.length / MAX_SAMPLES) * 100) + "%";
        if (samples.length >= MAX_SAMPLES) finalize();
    }

    function resetState() {
        isProcessing = false;
        samples = [];
        mask.style.display = 'none';
        scanLine.style.display = 'none';
        document.getElementById('progress-val').innerText = "0%";
    }

    async function finalize() {
        isLocked = true;
        isProcessing = false;
        mask.style.display = 'none';
        guideBox.style.display = "none";
        
        const counts = {};
        samples.forEach(s => counts[s] = (counts[s] || 0) + 1);
        const winner = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(winner));
        const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        
        statusDisplay.innerText = "私钥生成成功";
        statusDisplay.className = "status-box locked";
        keyBox.innerText = hex;
        resultArea.style.display = 'flex';

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(hex).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "已复制到剪贴板";
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            });
        };
    }

    init();
</script>
</body>
</html>
