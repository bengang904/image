<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE.加密</title>
    <script src="https://unpkg.com/node-forge@1.3.1/dist/forge.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --container-bg: #0a0a0a;
            --accent: #007bff;
            --reset-btn: #444;
            --success: #007bff;
            --text: #e0e0e0;
            --border: #222;
        }

        body { 
            font-family: "Microsoft YaHei", sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            background: var(--container-bg); 
            padding: 25px; 
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        h2 { 
            font-size: 1.1rem;
            font-weight: bold; 
            letter-spacing: 2px; 
            margin: 0 0 25px 0; 
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .controls { 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-wrapper {
            position: relative;
            width: 100%;
            height: 45px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            cursor: pointer;
            font-size: 14px;
            padding: 0 15px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #fileLabel {
            display: block;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        input[type="text"] { 
            background: #111; 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 12px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .progress-container {
            width: 100%;
            height: 2px;
            background: #111;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button { 
            padding: 14px; 
            cursor: pointer; 
            border: 1px solid var(--accent); 
            background: transparent; 
            color: var(--accent); 
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) { background: var(--accent); color: #000; }
        button:disabled { border-color: #333; color: #333; cursor: not-allowed; }
        
        button.reset { border-color: var(--reset-btn); color: #aaa; }
        button.reset:hover:not(:disabled) { border-color: #888; color: #fff; background: transparent; }

        #downloadBtn { 
            grid-column: span 2; 
            border: 1px solid var(--success); 
            color: var(--success); 
            margin-top: 5px;
            box-shadow: 0 0 0px var(--success);
        }
        #downloadBtn:hover:not(:disabled) { 
            background: var(--success); 
            color: #000;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
            transform: translateY(-1px);
        }
        #downloadBtn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        canvas { 
            width: 100%; 
            margin-top: 20px; 
            border: 1px solid var(--border);
            display: none; 
        }

        .status { font-size: 11px; color: #555; margin-top: 15px; }

        @media (max-width: 480px) {
            .btn-grid { grid-template-columns: 1fr; }
            #downloadBtn { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IMAGE.加密</h2>
    <div class="controls">
        <div class="file-wrapper">
            <span id="fileLabel">选择图像文件</span>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <input type="text" id="passwordInput" placeholder="输入访问密钥..." spellcheck="false">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="btn-grid">
            <button id="runBtn">执行变换</button>
            <button id="resetBtn" class="reset">清空所有</button>
            <button id="downloadBtn" disabled>下载处理结果</button>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="status" id="statusMsg">加密后的图像压缩失真则无法还原</div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const fileLabel = document.getElementById('fileLabel');
    const passwordInput = document.getElementById('passwordInput');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let originalBuffer = null;
    let imgW, imgH;

    imageInput.onchange = (e) => {
        if (!e.target.files[0]) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                imgW = img.width;
                imgH = img.height;
                canvas.width = imgW;
                canvas.height = imgH;
                ctx.drawImage(img, 0, 0);
                const raw = ctx.getImageData(0, 0, imgW, imgH);
                originalBuffer = new Uint8ClampedArray(raw.data);
                canvas.style.display = 'block';
                fileLabel.innerText = e.target.files[0].name;
                statusMsg.innerText = "已载入: " + imgW + "x" + imgH;
                downloadBtn.disabled = true;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    async function process() {
        if (!originalBuffer) {
            alert("请先选择一张图像文件");
            return;
        }
        const pass = passwordInput.value;
        if (!pass) {
            alert("请输入密钥后再执行操作");
            return;
        }

        runBtn.disabled = true;
        resetBtn.disabled = true;
        progressContainer.style.display = 'block';
        statusMsg.innerText = "正在应用变换...";

        const imgData = ctx.createImageData(imgW, imgH);
        imgData.data.set(originalBuffer);
        const data = imgData.data;

        let hash = forge.md.sha256.create();
        hash.update(pass);
        let key = forge.util.binary.raw.decode(hash.digest().data);

        const totalPixels = data.length;
        const chunkSize = 200000; 

        for (let i = 0; i < totalPixels; i += 4) {
            if (i % 64 === 0) {
                hash = forge.md.sha256.create();
                hash.update(forge.util.binary.raw.encode(key));
                key = forge.util.binary.raw.decode(hash.digest().data);
            }
            const k = (i / 4) % 8;
            data[i]     ^= key[k * 3];
            data[i+1]   ^= key[k * 3 + 1];
            data[i+2]   ^= key[k * 3 + 2];

            if (i % chunkSize === 0) {
                progressBar.style.width = Math.round((i / totalPixels) * 100) + "%";
                await new Promise(r => setTimeout(r, 1));
            }
        }

        ctx.putImageData(imgData, 0, 0);
        progressBar.style.width = "100%";
        
        setTimeout(() => {
            progressContainer.style.display = 'none';
            progressBar.style.width = "0%";
            runBtn.disabled = false;
            resetBtn.disabled = false;
            downloadBtn.disabled = false;
            statusMsg.innerText = "处理完成";
        }, 300);
    }

    runBtn.onclick = process;

    resetBtn.onclick = () => {
        imageInput.value = "";
        passwordInput.value = "";
        fileLabel.innerText = "选择图像文件";
        originalBuffer = null;
        canvas.style.display = 'none';
        downloadBtn.disabled = true;
        progressContainer.style.display = 'none';
        progressBar.style.width = "0%";
        statusMsg.innerText = "系统已重置";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.download = `RESULT_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    };
</script>
</body>
</html>
