<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMAGE.加密 (AES-GCM)</title>
    <style>
        :root {
            --bg: #000;
            --container-bg: #0a0a0a;
            --accent: #4d7fff; 
            --reset: #d1d1d1;
            --text: #e0e0e0;
            --border: #222;
        }
       body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 15px; 
            box-sizing: border-box;
        }
        .container { 
            background: var(--container-bg); 
            padding: 20px; 
            width: 100%;
            max-width: 500px; 
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        h2 { 
            font-size: clamp(14px, 5vw, 17px);
            color: var(--accent); 
            border-left: 3px solid var(--accent); 
            padding-left: 10px; 
            margin: 0 0 20px 0; 
            text-transform: uppercase;
        }
        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .file-wrapper { 
            position: relative; 
            height: 50px; 
            border: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #111; 
            cursor: pointer;
            padding: 0 10px;
        }
        .file-wrapper span {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #888;
        }
        .file-wrapper input { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            cursor: pointer; 
        }
        input[type="password"] { 
            background: #111; 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 14px; 
            outline: none; 
            font-size: 14px;
            border-radius: 0;
            box-sizing: border-box;
        }
        input[type="password"]:focus { border-color: var(--accent); }
        .progress-container { 
            width: 100%; 
            height: 2px; 
            background: #111; 
            display: none; 
        }
        .progress-bar { 
            width: 0%; 
            height: 100%; 
            background: var(--accent); 
            transition: width 0.3s;
        }

        .btn-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }
        button { 
            padding: 15px 5px; 
            cursor: pointer; 
            border: 1px solid var(--accent); 
            background: transparent; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 13px;
            border-radius: 0;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
        }
        button:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }
        
        #resetBtn {
            grid-column: span 2;
            justify-self: center; 
            width: 50%;         
            border-color: var(--reset);
            color: var(--reset);
            margin-top: 5px;
        }
        #resetBtn:hover:not(:disabled) {
            background: var(--reset);
            color: #000;
        }
        #downloadBtn { 
            grid-column: span 2; 
        }

        @media (max-width: 400px) {
            body { padding-top: 5vh; }
            .btn-grid { grid-template-columns: 1fr; }
            #encryptBtn, #decryptBtn, #resetBtn, #downloadBtn {
                grid-column: span 1; 
                width: 100%;  
            }
        }

        .status { 
            font-size: 11px; 
            color: #555; 
            margin-top: 20px; 
            text-align: center;
            line-height: 1.6;
            border-top: 1px solid #111;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IMAGE.加密 (AES-GCM)</h2>
    <div class="controls">
        <div class="file-wrapper">
            <span id="fileLabel">选择 BMP 图像文件</span>
            <input type="file" id="imageInput" accept=".bmp">
        </div>
        
        <input type="password" id="passwordInput" placeholder="输入密钥..." spellcheck="false">
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-grid">
            <button id="encryptBtn">加密</button>
            <button id="decryptBtn">解密</button>
            <button id="resetBtn">重置</button>
            <button id="downloadBtn" disabled>下载结果</button>
        </div>
    </div>

    <div class="status" id="statusMsg">
        BMP 图像文件：直接操作原始采样数据。由于 AES-GCM 具有严格的完整性校验，加密后的图像若经 JPG 压缩或编辑导致数据位偏移，将无法还原。建议使用无损环境传输。因此，你需要准备一个 BMP 格式的图像文件，也可以在 https://imagemagick.2024-10-24.zip 进行在线格式转换。
    </div>
</div>

<script>
    const ui = {
        file: document.getElementById('imageInput'),
        label: document.getElementById('fileLabel'),
        pass: document.getElementById('passwordInput'),
        enc: document.getElementById('encryptBtn'),
        dec: document.getElementById('decryptBtn'),
        reset: document.getElementById('resetBtn'),
        dl: document.getElementById('downloadBtn'),
        status: document.getElementById('statusMsg'),
        prog: document.getElementById('progressBar'),
        cont: document.getElementById('progressContainer')
    };

    let resultBlob = null;
    let fileName = "";

    async function getDerivedKey(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
            baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    ui.file.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            ui.label.innerText = file.name;
            fileName = file.name;
            ui.dl.disabled = true;
        }
    };

    async function run(mode) {
        const file = ui.file.files[0];
        const pass = ui.pass.value;
        if (!file || !pass) return alert("信息缺失");

        ui.enc.disabled = ui.dec.disabled = true;
        ui.cont.style.display = 'block';
        ui.prog.style.width = "40%";
        ui.status.innerText = "正在派生密钥并处理数据...";

        try {
            const buffer = await file.arrayBuffer();
            const view = new DataView(buffer);
            
            if (view.getUint16(0, true) !== 0x4D42) throw new Error("非法格式");

            const offset = view.getUint32(10, true);
            const header = buffer.slice(0, offset);
            const pixelData = new Uint8Array(buffer.slice(offset));

            ui.prog.style.width = "70%";
            let finalPixels;

            if (mode === 'enc') {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await getDerivedKey(pass, salt);
                const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, pixelData);
                
                finalPixels = new Uint8Array(salt.length + iv.length + cipher.byteLength);
                finalPixels.set(salt, 0);
                finalPixels.set(iv, 16);
                finalPixels.set(new Uint8Array(cipher), 28);
                ui.status.innerText = "加密完成";
            } else {
                const salt = pixelData.slice(0, 16);
                const iv = pixelData.slice(16, 28);
                const data = pixelData.slice(28);
                const key = await getDerivedKey(pass, salt);
                const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
                finalPixels = new Uint8Array(plain);
                ui.status.innerText = "解密完成";
            }

            const out = new Uint8Array(header.byteLength + finalPixels.length);
            out.set(new Uint8Array(header), 0);
            out.set(finalPixels, header.byteLength);
            new DataView(out.buffer).setUint32(2, out.byteLength, true);

            resultBlob = new Blob([out], { type: "image/bmp" });
            ui.dl.disabled = false;
            ui.prog.style.width = "100%";

        } catch (e) {
            console.error(e);
            ui.status.innerText = "错误：认证失败（密码错误或文件损坏）";
            ui.prog.style.backgroundColor = "#ff0000";
        } finally {
            ui.enc.disabled = ui.dec.disabled = false;
            setTimeout(() => { ui.cont.style.display = 'none'; ui.prog.style.width = "0%"; }, 1000);
        }
    }

    ui.enc.onclick = () => run('enc');
    ui.dec.onclick = () => run('dec');

    ui.reset.onclick = () => location.reload();

    ui.dl.onclick = () => {
        if (!resultBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(resultBlob);
        a.download = (ui.status.innerText.includes("加密") ? "ENC_" : "DEC_") + fileName;
        a.click();
    };
</script>
</body>
</html>
